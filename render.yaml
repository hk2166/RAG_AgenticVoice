services:
  - type: web
    name: voice-rag-agent
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9
